name: CI

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target device codename to build (or "all")'
        required: true
        default: 'r9s'
        type: string

jobs:
  
  generate-matrix:
    name: Generate matrix
    runs-on: ubuntu-24.04

    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Generate CI matrix
        id: generate-matrix
        run: |
          TARGET_INPUT="${{ inputs.target }}"
          if [ -n "$TARGET_INPUT" ] && [ "$TARGET_INPUT" != "all" ]; then
            if [ ! -d "target/$TARGET_INPUT" ]; then
              echo "Invalid target: $TARGET_INPUT" >&2
              exit 1
            fi
            matrix="$(jq -n --arg t "$TARGET_INPUT" '[$t]')"
          else
            matrix="$(find target -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
              | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          fi
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: [generate-matrix]
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate build config
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Build dependencies
        run: ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: ./scripts/extract_fw.sh

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh --build-rom-zip

      - name: Upload to GoFile
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

          SERVER="$(curl -fsSL https://api.gofile.io/servers | jq -r '.data.servers[0].name // empty' || true)"
          if [ -n "$SERVER" ]; then
            UPLOAD_URL="https://${SERVER}.gofile.io/uploadFile"
          else
            UPLOAD_URL="https://upload.gofile.io/uploadFile"
          fi

          shopt -s nullglob
          ZIPS=(out/UN1CA_*.zip)
          if [ "${#ZIPS[@]}" -eq 0 ]; then
            ZIPS=(out/*.zip)
          fi

          for FILE in "${ZIPS[@]}"; do
            echo "Uploading: $FILE -> $UPLOAD_URL"

            RESPONSE="$(curl -fsSL \
              -F "file=@${FILE}" \
              -F "token=${{ secrets.GOFILE_TOKEN }}" \
              -F "folderId=${{ secrets.GOFILE_FOLDER_ID }}" \
              "$UPLOAD_URL")"

            STATUS="$(echo "$RESPONSE" | jq -r '.status // empty')"
            if [ "$STATUS" != "ok" ]; then
              echo "GoFile upload failed: $RESPONSE" >&2
              exit 1
            fi

            echo "Download URL:"
            echo "$RESPONSE" | jq -r '.data.downloadPage'

            echo "MD5:"
            md5sum "$FILE"

            echo "SHA256:"
            sha256sum "$FILE"

            echo "----------------------------------------"
          done
