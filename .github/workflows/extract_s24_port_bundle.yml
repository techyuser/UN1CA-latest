name: Extract S24+ Complete Port Bundle

on:
  workflow_dispatch:
    inputs:
      s24_firmware:
        description: 'S24+ (One UI 9.0) firmware (MODEL/CSC/IMEI). Blank reads s24_essi.sh.'
        required: false
        default: 'SM-S926B/INS/352737401108148'
        type: string
      target_firmware:
        description: 'Your r9s (One UI 8.0 / SDK 36) base firmware for matching Settings/AOD/Lockscreen/Clock APKs. Blank skips.'
        required: false
        default: 'SM-G990E/INS/355798871234563'
        type: string
      include_r9s_base_apks:
        description: 'Extract matching r9s SDK 36 base APKs (needed to cross-port S24+ Settings/AOD/Lockscreen/Clock/Gallery)'
        required: false
        default: true
        type: boolean
      s24_bundle_scope:
        description: 'Which S24+ files to include'
        required: false
        default: 'port-full'
        type: choice
        options:
          - port-full
          - media-and-apps-only
          - all-apks-and-media
      extra_patterns:
        description: 'Optional comma-separated case-insensitive substrings to also force-include'
        required: false
        default: ''
        type: string
      force:
        description: 'Pass --force to download_fw.sh and extract_fw.sh'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - extract-s24-port
    paths:
      - '.github/workflows/extract_s24_port_bundle.yml'
      - 's24_essi.sh'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    name: Extract S24+ Port Bundle (${{ inputs.s24_bundle_scope || 'port-full' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg jq libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler webp zip
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq "linux-modules-extra-$(uname -r)" || \
            echo "Warning: linux-modules-extra-$(uname -r) unavailable; relying on built-in modules / fuse.erofs"
          sudo modprobe erofs || true
          sudo modprobe f2fs || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate build config
        run: |
          if ! source ./buildenv.sh r9s; then
            export DEBUG=false
            export SRC_DIR="$PWD"
            export OUT_DIR="$SRC_DIR/out"
            export ODIN_DIR="$OUT_DIR/odin"
            export FW_DIR="$OUT_DIR/fw"
            export TOOLS_DIR="$OUT_DIR/tools"
            export APKTOOL_DIR="$OUT_DIR/apktool"
            export WORK_DIR="$OUT_DIR/work"
            export TMP_DIR="$OUT_DIR/tmp"
            mkdir -p "$OUT_DIR" "$ODIN_DIR" "$FW_DIR" "$TOOLS_DIR/bin" "$TMP_DIR"
          fi
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          if [ -f "$OUT_DIR/config.sh" ]; then
            sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          fi
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Resolve firmwares
        env:
          IN_S24_FW: ${{ inputs.s24_firmware }}
          IN_TGT_FW: ${{ inputs.target_firmware }}
          IN_INC_R9S: ${{ inputs.include_r9s_base_apks }}
          IN_SCOPE: ${{ inputs.s24_bundle_scope }}
          IN_EXTRA: ${{ inputs.extra_patterns }}
          IN_FORCE: ${{ inputs.force }}
        run: |
          S24_FW="${IN_S24_FW:-}"
          if [ -z "$S24_FW" ] && [ -f "$SRC_DIR/s24_essi.sh" ]; then
            SOURCE_FIRMWARE=""
            # shellcheck disable=SC1091
            source "$SRC_DIR/s24_essi.sh"
            S24_FW="$SOURCE_FIRMWARE"
          fi
          [ -z "$S24_FW" ] && S24_FW="SM-S926B/INS/352737401108148"

          TGT_FW="${IN_TGT_FW:-}"
          INC_R9S="${IN_INC_R9S:-true}"
          if [ "$INC_R9S" != "true" ]; then
            TGT_FW=""
          elif [ -z "$TGT_FW" ] && [ -f "$SRC_DIR/target/r9s/config.sh" ]; then
            TARGET_FIRMWARE=""
            # shellcheck disable=SC1091
            source "$SRC_DIR/target/r9s/config.sh"
            TGT_FW="$TARGET_FIRMWARE"
          fi

          for fw in $S24_FW $TGT_FW; do
            if ! [[ "$fw" =~ ^[^/]+/[A-Za-z0-9]{3}/[^/]+$ ]]; then
              echo "::error::Invalid firmware format '$fw' (expected MODEL/CSC/IMEI_OR_SN)"
              exit 1
            fi
          done

          S24_TAG="$(cut -d '/' -f 1 <<< "$S24_FW")_$(cut -d '/' -f 2 <<< "$S24_FW")"
          {
            echo "S24_FW=$S24_FW"
            echo "TGT_FW=$TGT_FW"
            echo "S24_TAG=$S24_TAG"
            echo "BUNDLE_SCOPE=${IN_SCOPE:-port-full}"
            echo "EXTRA_PATTERNS=${IN_EXTRA:-}"
            echo "FORCE_FLAG=${IN_FORCE:-false}"
          } >> "$GITHUB_ENV"
          echo "S24+ FW: $S24_FW | r9s FW: ${TGT_FW:-<skipped>} | Scope: ${IN_SCOPE:-port-full}"

      - name: Build dependencies
        run: ./scripts/build_dependencies.sh

      - name: Process S24+ and r9s firmwares sequentially (disk-safe)
        run: |
          set -euo pipefail
          STAGE_DIR="$TMP_DIR/s24_port_stage"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"

          EXTRA_ARGS=(--ignore-source --ignore-target)
          if [[ "${FORCE_FLAG:-false}" == "true" ]]; then
            EXTRA_ARGS+=(--force)
          fi

          process_one() {
            local ROLE="$1"
            local FW="$2"
            local OUT_NAME="$3"
            local MODEL CSC KEY SRC_ROOT
            MODEL="$(cut -d '/' -f 1 <<< "$FW")"
            CSC="$(cut -d '/' -f 2 <<< "$FW")"
            KEY="${MODEL}_${CSC}"

            echo "=== Downloading $ROLE ($FW) ==="
            local ok=0
            for attempt in 1 2 3; do
              if ./scripts/download_fw.sh "${EXTRA_ARGS[@]}" "$FW"; then
                ok=1
                break
              fi
              echo "Download attempt $attempt failed; retrying in 10s..."
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::Failed downloading $FW after 3 attempts"
              exit 1
            fi

            echo "=== Extracting $ROLE ($FW) ==="
            ./scripts/extract_fw.sh "${EXTRA_ARGS[@]}" "$FW"

            SRC_ROOT="$FW_DIR/$KEY"
            if [ ! -d "$SRC_ROOT" ]; then
              echo "::error::Extracted directory missing: $SRC_ROOT"
              exit 1
            fi

            echo "=== Collecting $ROLE assets ($BUNDLE_SCOPE) ==="
            python3 - "$SRC_ROOT" "$STAGE_DIR/$OUT_NAME" "$ROLE" "$BUNDLE_SCOPE" "${EXTRA_PATTERNS:-}" <<'PY'
          import os
          import re
          import shutil
          import sys

          src_root, dst_root, role, scope, extra_raw = sys.argv[1:6]
          extra_patterns = [p.strip().lower() for p in extra_raw.split(",") if p.strip()]
          os.makedirs(dst_root, exist_ok=True)
          src_real = os.path.realpath(src_root)

          already_extracted_names = {
              "systemui.apk", "touchwizhome_2017.apk", "secsettings.apk",
              "secsettingsintelligence.apk", "aodservice_v80.apk", "dressroom.apk",
              "dynamiclockscreen.apk", "wallpaper-res.apk", "wallpapercropper.apk",
              "wallpaperbackup.apk", "themecenter.apk", "themestore.apk", "intentresolver.apk",
          }

          port_pkg_re = re.compile(
              r"(?:^|/)(?:"
              r".*systemui.*|framework-res(?:\.apk)?|samsung-framework-res.*|sec_platform_library.*|"
              r"framework\.jar|services\.jar|samsung-services\.jar|sem_[^/]*\.apk|"
              r"secsettings[^/]*|aodservice[^/]*|alwaysondisplay[^/]*|themecenter[^/]*|themestore[^/]*|"
              r"dynamiclock[^/]*|keyguard[^/]*|lockscreen[^/]*|clockpackage[^/]*|"
              r"oneuihome[^/]*|seclauncher[^/]*|touchwizhome[^/]*|wallpaper[^/]*|freshwallpaper[^/]*|"
              r"dressroom[^/]*|aiwallpaper[^/]*|spritewallpaper[^/]*|liveeffect[^/]*|"
              r"(?:samsung)?permissioncontroller[^/]*|intentresolver[^/]*|"
              r"goodlock[^/]*|navstar[^/]*|quickstar[^/]*|statusbar[^/]*|"
              r".*galaxy.*ai.*|.*personaldataintelligence.*|.*nowbrief.*|.*brief[^/]*|personalization|"
              r".*smartsuggestions.*|.*samsungaicore.*|aicore|.*moments.*|.*vision[^/]*|.*rubin.*|"
              r".*visualcloudcore.*|.*vexfwk.*|.*mhsai.*|.*knoxneuralnetwork.*|.*androidsystemintelligence.*|"
              r".*privatecomputeservices.*|.*smartfaceservice.*|"
              r".*cocktail[^/]*|.*edge[^/]*|.*taskedge.*|.*clipboardedge.*|"
              r".*screencapture.*|.*smartcapture.*|.*callassistant.*|.*smartcall.*|"
              r".*smartthings[^/]*|.*mcfdevicesync.*|.*multicontrol.*|.*smartmirroring.*|.*smartmanager.*|"
              r".*mosey[^/]*|.*wonder[^/]*|.*awdl[^/]*|"
              r".*sharelive[^/]*|.*allshare[^/]*|.*quickshare[^/]*|.*storageshare.*|.*hwresourceshare.*|.*samsungmulticonnectivity.*|"
              r".*bixby[^/]*|.*mediacontrol.*|.*soundpicker.*|"
              r".*soundalive.*|.*adaptsound.*|.*volumemonitor.*|.*multisound.*|.*audiomirroring.*|"
              r".*budsunite.*|.*scone.*"
              r")(?:/|$)",
              re.IGNORECASE,
          )

          lib_kw = (
              "wallpaperfilter", "facepreprocessing", "smart_cropping", "blur", "agsl",
              "visualeffect", "multisource", "sourceseparator", "eraser", "soundalive",
              "libsound", "libaudio", "saiv", "hwui", "renderengine",
              "mosey", "wonder", "awdl", "aware", "nearby", "nan",
          )

          def include_s24(rel: str) -> bool:
              low = rel.lower()
              parts = low.split("/")
              if "oat" in parts or "prof" in parts:
                  return False
              base = os.path.basename(low)

              if base in {".extracted", "os_partitions_metadata.txt", "build.prop", "default.prop", "floating_feature.xml"} or (low.endswith("_metadata.txt") and "/" not in low):
                  return True

              if scope == "all-apks-and-media":
                  if base.endswith((".apk", ".jar", ".so", ".ogg", ".wav", ".flac", ".m4a", ".qmg", ".spi", ".ttf", ".otf", ".ttc", ".xml")):
                      if "/lib" in f"/{low}" and not base.endswith(".so"):
                          return False
                      if any(x in f"/{low}" for x in ("/app/", "/priv-app/", "/system_ext/", "/product/", "/framework/", "/media/", "/fonts/", "/etc/", "/overlay/")):
                          return True
                  return False

              # Always include S24+ UI sounds, ringtones, alarms, notifications, charging sounds, boot/shutdown qmg!
              if "/media/" in f"/{low}" and base.endswith((".ogg", ".wav", ".flac", ".m4a", ".qmg", ".spi", ".mp4", ".webp", ".json")):
                  return True

              if extra_patterns and any(pat in low for pat in extra_patterns):
                  if base.endswith((".apk", ".jar", ".so", ".xml", ".prop", ".ttf", ".otf", ".ttc", ".ogg", ".qmg")):
                      return True

              if scope == "media-and-apps-only":
                  if base in already_extracted_names:
                      return False
                  if port_pkg_re.search(low) and (base.endswith((".apk", ".jar", ".so")) or "/lib/" in f"/{low}" or "/lib64/" in f"/{low}"):
                      return True
                  return False

              # port-full
              if "/fonts/" in f"/{low}" and base.endswith((".ttf", ".otf", ".ttc")):
                  return True
              if "/etc/" in f"/{low}" and (base.startswith(("fonts", "font_fallback", "audio", "media")) or "/permissions/" in f"/{low}" or "/sysconfig/" in f"/{low}") and base.endswith((".xml", ".conf", ".json")):
                  return True
              if ("/etc/init/" in f"/{low}" or "/etc/selinux/" in f"/{low}") and any(k in low for k in ("mosey", "wonder", "sharelive", "aware", "awdl", "seapp_contexts", "sepolicy", "file_contexts")):
                  return True
              if "/bin/" in f"/{low}" and any(k in base for k in ("mosey", "wonder", "awdl")):
                  return True
              if "/lib/modules/" in f"/{low}" and base.endswith(".ko") and any(k in base for k in ("wonder", "bcmdhd", "wlan", "wifi", "dhd")):
                  return True
              if "/overlay/" in f"/{low}" and base.endswith(".apk"):
                  return True
              if "/framework/" in f"/{low}" and base.endswith((".apk", ".jar")):
                  return True
              if any(p in f"/{low}" for p in ("/system/", "/system_ext/", "/product/", "/vendor/")) and ("/lib/" in f"/{low}" or "/lib64/" in f"/{low}") and base.endswith(".so"):
                  if port_pkg_re.search(low) or any(k in base for k in lib_kw):
                      return True
              if port_pkg_re.search(low) and (base.endswith((".apk", ".so")) or ("/lib/" in f"/{low}" and base.endswith(".so"))):
                  return True
              return False

          def include_r9s(rel: str) -> bool:
              low = rel.lower()
              parts = low.split("/")
              if "oat" in parts or "prof" in parts:
                  return False
              base = os.path.basename(low)
              if base in {".extracted", "os_partitions_metadata.txt", "build.prop", "default.prop", "floating_feature.xml"}:
                  return True
              if "/etc/" in f"/{low}" and (base.startswith(("fonts", "font_fallback", "audio", "media")) or "/permissions/" in f"/{low}" or "/sysconfig/" in f"/{low}") and base.endswith((".xml", ".conf", ".json")):
                  return True
              if ("/etc/init/" in f"/{low}" or "/etc/selinux/" in f"/{low}" or "/etc/wifi/" in f"/{low}") and any(k in low for k in ("mosey", "wonder", "sharelive", "aware", "awdl", "seapp_contexts", "sepolicy", "file_contexts", "wifi", "bcmdhd")):
                  return True
              if "/lib/modules/" in f"/{low}" and base.endswith(".ko") and any(k in base for k in ("wonder", "bcmdhd", "wlan", "wifi", "dhd")):
                  return True
              if "/overlay/" in f"/{low}" and base.endswith(".apk"):
                  return True
              if "/framework/" in f"/{low}" and base.endswith((".apk", ".jar")):
                  return True
              if any(p in f"/{low}" for p in ("/system/", "/system_ext/", "/product/")) and ("/lib/" in f"/{low}" or "/lib64/" in f"/{low}") and base.endswith(".so"):
                  if port_pkg_re.search(low) or any(k in base for k in lib_kw):
                      return True
              if port_pkg_re.search(low) and base.endswith((".apk", ".so")):
                  return True
              return False

          fn = include_s24 if role == "s24" else include_r9s
          inventory, manifest, symlinks = [], [], []
          for dirpath, dirnames, filenames in os.walk(src_root, followlinks=False):
              dirnames[:] = sorted(d for d in dirnames if d not in {"oat", "__pycache__"})
              for fname in sorted(filenames):
                  full = os.path.join(dirpath, fname)
                  rel = os.path.relpath(full, src_root).replace(os.sep, "/")
                  if os.path.islink(full):
                      symlinks.append(f"{rel} -> {os.readlink(full)}")
                      if not fn(rel):
                          continue
                      resolved = os.path.realpath(full)
                      if not (resolved == src_real or resolved.startswith(src_real + os.sep)) or not os.path.isfile(resolved):
                          continue
                      use_p = resolved
                  elif os.path.isfile(full):
                      use_p = full
                  else:
                      continue
                  sz = os.path.getsize(use_p)
                  if rel.lower().endswith((".apk", ".jar", ".so", ".ogg", ".qmg", ".ttf", ".otf", "floating_feature.xml", "build.prop")):
                      inventory.append(f"{sz:>12}  {rel}")
                  if fn(rel):
                      dst = os.path.join(dst_root, rel)
                      os.makedirs(os.path.dirname(dst), exist_ok=True)
                      shutil.copy2(use_p, dst)
                      manifest.append(f"{sz:>12}  {rel}")

          with open(os.path.join(dst_root, "file_inventory.txt"), "w", encoding="utf-8") as f:
              f.write("\n".join(inventory) + ("\n" if inventory else ""))
          with open(os.path.join(dst_root, "bundle_manifest.txt"), "w", encoding="utf-8") as f:
              f.write("\n".join(manifest) + ("\n" if manifest else ""))
          if symlinks:
              with open(os.path.join(dst_root, "symlinks.txt"), "w", encoding="utf-8") as f:
                  f.write("\n".join(symlinks) + "\n")
          print(f"[{role}] inventory={len(inventory)}, bundled={len(manifest)}, bytes={sum(int(x.split()[0]) for x in manifest)}")
          PY

            echo "=== Cleaning extracted partitions for $KEY to reclaim runner disk ==="
            rm -rf "$FW_DIR/$KEY" "$ODIN_DIR/$KEY"
          }

          process_one "s24" "$S24_FW" "SM-S926B_INS"
          if [ -n "${TGT_FW:-}" ]; then
            process_one "r9s" "$TGT_FW" "r9s_Base"
          fi

          STAMP="$(date -u +%Y%m%d_%H%M%S)"
          ZIP_NAME="UN1CA_S24Plus_PortBundle_${S24_TAG}_${BUNDLE_SCOPE}_${STAMP}.zip"
          ZIP_PATH="$OUT_DIR/$ZIP_NAME"
          rm -f "$ZIP_PATH"
          (
            cd "$STAGE_DIR"
            zip -q -r -3 "$ZIP_PATH" .
          )
          rm -rf "$STAGE_DIR"

          {
            echo "ZIP_PATH=$ZIP_PATH"
            echo "ZIP_NAME=$ZIP_NAME"
            echo "ZIP_SIZE_BYTES=$(wc -c < "$ZIP_PATH")"
            echo "ZIP_SIZE_HR=$(du -h "$ZIP_PATH" | cut -f1)"
            echo "ZIP_MD5=$(md5sum "$ZIP_PATH" | awk '{print $1}')"
            echo "ZIP_SHA256=$(sha256sum "$ZIP_PATH" | awk '{print $1}')"
          } >> "$GITHUB_ENV"

      - name: Upload bundle to GoFile
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
          GOFILE_FOLDER_ID: ${{ secrets.GOFILE_FOLDER_ID }}
        run: |
          set -euo pipefail
          [ -f "$ZIP_PATH" ] || { echo "::error::Archive not found at $ZIP_PATH"; exit 1; }

          SERVERS_JSON="$(curl -fsSL --retry 3 --retry-delay 3 https://api.gofile.io/servers || true)"
          mapfile -t CANDIDATES < <(jq -r '.data.servers[]?.name // empty' <<< "$SERVERS_JSON" 2>/dev/null || true)
          CANDIDATES+=("upload")

          CURL_EXTRA=()
          if [ -n "$GOFILE_TOKEN" ]; then
            CURL_EXTRA+=(-F "token=${GOFILE_TOKEN}")
          fi
          if [ -n "$GOFILE_FOLDER_ID" ]; then
            CURL_EXTRA+=(-F "folderId=${GOFILE_FOLDER_ID}")
          fi

          RESPONSE=""
          UPLOADED=false
          for SRV in "${CANDIDATES[@]}"; do
            UPLOAD_URL="https://${SRV}.gofile.io/uploadFile"
            echo "Trying GoFile server: $UPLOAD_URL"
            if RESPONSE="$(curl -fsSL --http1.1 --retry 2 --retry-delay 5 \
              -F "file=@${ZIP_PATH}" \
              "${CURL_EXTRA[@]}" \
              "$UPLOAD_URL")"; then
              STATUS="$(jq -r '.status // empty' <<< "$RESPONSE" 2>/dev/null || true)"
              if [[ "$STATUS" == "ok" ]]; then
                UPLOADED=true
                break
              fi
              echo "Unexpected response from $UPLOAD_URL: $RESPONSE"
            fi
          done

          if ! $UPLOADED; then
            echo "::error::Failed to upload archive to GoFile"
            exit 1
          fi

          DOWNLOAD_URL="$(jq -r '.data.downloadPage // empty' <<< "$RESPONSE")"
          DIRECT_LINK="$(jq -r '.data.directLink // empty' <<< "$RESPONSE")"

          {
            echo "## S24+ Complete Port Bundle Ready"
            echo ""
            echo "| Field | Value |"
            echo "| :--- | :--- |"
            echo "| **S24+ Firmware** | \`$S24_FW\` |"
            echo "| **r9s Base Firmware** | \`${TGT_FW:-none}\` |"
            echo "| **Scope** | \`$BUNDLE_SCOPE\` |"
            echo "| **Archive** | \`$ZIP_NAME\` |"
            echo "| **Size** | $ZIP_SIZE_HR (\`$ZIP_SIZE_BYTES\` bytes) |"
            echo "| **MD5** | \`$ZIP_MD5\` |"
            echo "| **SHA256** | \`$ZIP_SHA256\` |"
            echo "| **GoFile Download** | $DOWNLOAD_URL |"
            if [ -n "$DIRECT_LINK" ]; then
              echo "| **Direct Link** | $DIRECT_LINK |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "GoFile URL: $DOWNLOAD_URL"

